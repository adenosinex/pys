<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>徒步预测 (纯净键盘&智能坐标版)</title>
    <script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" type="text/css" />
    <style>
        :root { --primary: #007aff; --bg: #f2f2f7; --card-bg: #ffffff; --text: #1c1c1e; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 15px; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
        .container { max-width: 600px; margin: 0 auto; }
        h2 { font-size: 24px; font-weight: 600; margin-bottom: 20px; text-align: center; }
        .card { background: var(--card-bg); border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.04); }
        .card-title { font-size: 16px; font-weight: 600; margin-top: 0; margin-bottom: 15px; color: #8e8e93; text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
        select, input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 10px; border: 1px solid #e5e5ea; border-radius: 8px; font-size: 16px; outline: none; background: #fafafa; transition: border-color 0.2s; }
        select:focus, input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
        button:active { opacity: 0.8; }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .flex-row input { margin-bottom: 0; }
        .flex-row button { width: auto; white-space: nowrap; padding: 12px 16px; }
        .result-box { margin-top: 15px; padding: 15px; border-radius: 8px; font-size: 18px; display: none; }
        .result-box.success { background: #e5f4e7; border: 1px solid #cce9d4; }
        .result-box.error { background: #feebeb; color: #ff3b30; border: 1px solid #fcdada; text-align: center; }
        details { background: var(--card-bg); border-radius: 12px; padding: 15px 20px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.04); }
        summary { font-size: 16px; font-weight: 600; color: var(--primary); cursor: pointer; outline: none; margin-bottom: 0;}
        summary::-webkit-details-marker { display: none; }
        details[open] summary { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        .dropzone { border: 2px dashed #c7c7cc; border-radius: 12px; background: #fafafa; padding: 20px; text-align: center; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        .file-list { margin: 0; padding: 0; list-style: none; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f2f2f7; font-size: 14px; }
        #workspace { display: none; }
        .btn-action { background: #ff9500; font-size: 14px; padding: 8px 12px; border-radius: 6px; font-weight: 500;}
        .btn-success { background: #34c759; }
        .input-group { position: relative; margin-bottom: 10px; }
        .input-group label { display: block; font-size: 12px; color: #8e8e93; margin-bottom: 4px; }
        
        /* 独立纯数字时间输入框样式优化 */
        .time-boxes { display: flex; align-items: center; gap: 4px; }
        .time-boxes input { 
            width: 50px; padding: 10px 4px; text-align: center; margin: 0; 
            -moz-appearance: textfield; border-radius: 6px; font-size: 18px; font-weight: 500;
        }
        /* 隐藏数字箭头的原生样式 */
        .time-boxes input::-webkit-outer-spin-button,
        .time-boxes input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .time-boxes span { font-weight: bold; color: #8e8e93; font-size: 18px; }
        #trackMapSvg { width: 100%; height: auto; display: block; background: #f7f7fa; border-radius: 8px; }
        .km-label { font-size: 11px; fill: #666; paint-order: stroke; stroke: #f7f7fa; stroke-width: 3px; }
        .km-dot { cursor: pointer; }
    </style>
</head>
<body>
<div class="container">
    <h2>🏔️ 路线预测</h2>

    <div class="card">
        <select id="projectSelect">
            <option value="">-- 选择路线项目 --</option>
        </select>
        <div class="flex-row" style="margin-top: 10px;">
            <input type="text" id="newProjectName" placeholder="新路线名称">
            <button onclick="createProject()">新建</button>
        </div>
    </div>

    <div id="workspace">
        <div class="card">
            <div class="card-title">🕒 时间联动助手</div>
            <div class="flex-row" style="margin-bottom: 12px; justify-content: space-between;">
                <div class="input-group">
                    <label>起点时间 (自动存)</label>
                    <div class="time-boxes">
                        <input type="number" id="startH" placeholder="时" min="0" max="23" inputmode="numeric" oninput="handleStartTimeChange()" onclick="this.select()">
                        <span>:</span>
                        <input type="number" id="startM" placeholder="分" min="0" max="59" inputmode="numeric" oninput="handleStartTimeChange()" onclick="this.select()">
                    </div>
                    <button onclick="setStartNow()" type="button" style="margin-top:6px;padding:6px 10px;font-size:13px;">设为现在</button>
                </div>
                <div class="input-group">
                    <label>当前时间 (修改即联动)</label>
                    <div class="time-boxes">
                        <input type="number" id="nowH" placeholder="时" min="0" max="23" inputmode="numeric" oninput="markTimeTouched(); calcDiffTime()" onclick="this.select()">
                        <span>:</span>
                        <input type="number" id="nowM" placeholder="分" min="0" max="59" inputmode="numeric" oninput="markTimeTouched(); calcDiffTime()" onclick="this.select()">
                    </div>
                </div>
            </div>
            <button onclick="setNowTime()" class="btn-success" style="margin-bottom: 0;">一键填入系统当前时间</button>
        </div>

        <div class="card">
            <div class="card-title">
                📍 数据测算区
                <button id="gpsBtn" onclick="autoLocate()" class="btn-action" style="width: auto;">设备自动定位</button>
            </div>
            <div id="locStatus" style="font-size:12px;color:#8e8e93;margin-bottom:8px;"></div>
            
            <div class="flex-row" style="margin-bottom: 10px;">
                <input type="text" id="manualGpsInput" placeholder="填入任意格式坐标文本">
                <button onclick="manualLocate()" class="btn-action" style="background: #007aff;">解析</button>
            </div>

            <div class="input-group">
                <label>当前行进距离 (公里)</label>
                <input type="number" id="currDist" step="0.1" min="0" placeholder="可手动或GPS自动填入" inputmode="decimal" oninput="tryAutoPredict()">
            </div>
            <div class="input-group">
                <label>当前已耗时 (小时)</label>
                <input type="number" id="currTime" step="0.1" min="0" placeholder="上方时间助手自动计算填入" inputmode="decimal" style="background: #e5f4e7; border-color: #34c759;" oninput="tryAutoPredict()">
            </div>
            
            <button onclick="predictTimeLocally()">前端离线测算</button>
            <div id="predictResult" class="result-box"></div>
            <div id="trackMapWrap" style="display:none;margin-top:15px;">
                <div style="font-size:12px;color:#8e8e93;margin-bottom:6px;">🗺️ 路线示意图（点公里标记可填入距离）</div>
                <div id="trackMap"></div>
            </div>
        </div>

        <div class="card" id="recordsCard" style="display: none;">
            <div class="card-title">📂 已缓存参考基准</div>
            <ul class="file-list" id="gpxList"></ul>
        </div>

        <details id="uploadDetails">
            <summary>+ 补充参考轨迹 (GPX / KML / KMZ)</summary>
            <div id="gpxDropzone" class="dropzone"></div>
        </details>
    </div>
</div>

<script>
    Dropzone.autoDiscover = false;
    const API_PREFIX = 'api'; 
    let currentProjectId = null;
    let myDropzone = null;
    let projectCsvDataCache = [];
    let uploadQueue = [];
    let isUploading = false;

    // ==================== 纯数字键盘时间联动 ====================
    
    // 输入即可触发缓存和联动计算，抛弃原本冗余的“设为起点”按钮
    function handleStartTimeChange() {
        const h = document.getElementById('startH').value;
        const m = document.getElementById('startM').value;
        // 只有时和分都填了才缓存
        if (h !== '' && m !== '') {
            const timeStr = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
            const now = new Date();
            let stamp = new Date(now.getFullYear(), now.getMonth(), now.getDate(), parseInt(h), parseInt(m));
            if (stamp.getTime() > now.getTime() + 5 * 60000) stamp = new Date(stamp.getTime() - 24 * 3600 * 1000);
            const dateStr = stamp.getFullYear() + '-' + String(stamp.getMonth() + 1).padStart(2, '0') + '-' + String(stamp.getDate()).padStart(2, '0');
            localStorage.setItem('hike_start_v2', dateStr + 'T' + timeStr);
            calcDiffTime(); 
        }
    }

    function loadTimeStatus() {
        localStorage.removeItem('hike_start_hm');
        const raw = localStorage.getItem('hike_start_v2');
        if (!raw) return;
        const parts = raw.split('T');
        if (parts.length !== 2) return;
        const dp = parts[0].split('-');
        const tp = parts[1].split(':');
        if (dp.length !== 3 || tp.length !== 2) return;
        const stored = new Date(parseInt(dp[0]), parseInt(dp[1]) - 1, parseInt(dp[2]), parseInt(tp[0]), parseInt(tp[1]));
        const elapsedMs = Date.now() - stored.getTime();
        if (isNaN(elapsedMs) || elapsedMs < 0 || elapsedMs > 12 * 3600 * 1000) {
            localStorage.removeItem('hike_start_v2');
            return;
        }
        document.getElementById('startH').value = tp[0];
        document.getElementById('startM').value = tp[1];
    }

    let timeTouched = false;
    function markTimeTouched() { timeTouched = true; }
    function setStartNow() {
        const now = new Date();
        document.getElementById('startH').value = String(now.getHours()).padStart(2, '0');
        document.getElementById('startM').value = String(now.getMinutes()).padStart(2, '0');
        handleStartTimeChange();
    }
    function startTimeTicker() {
        setNowTime();
        setInterval(() => {
            if (!timeTouched && document.visibilityState === 'visible') setNowTime();
        }, 60000);
    }
    let expectedCsvCount = 0;
    let watchId = null;
    let lastWatchUpdate = 0;
    function hmNow() {
        const d = new Date();
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    function setLocStatus(msg) {
        const el = document.getElementById('locStatus');
        if (el) el.textContent = msg;
    }
    function cacheReady() {
        return expectedCsvCount > 0 && projectCsvDataCache.length >= expectedCsvCount;
    }
    function tryAutoPredict() {
        if (projectCsvDataCache.length === 0) return;
        const d = parseFloat(document.getElementById('currDist').value);
        const t = parseFloat(document.getElementById('currTime').value);
        if (isNaN(d) || isNaN(t) || d <= 0 || t <= 0) return;
        predictTimeLocally();
    }
    function applyPosition(position, silent) {
        const result = matchRouteWithCoordinates(position.coords.latitude, position.coords.longitude);
        if (result.error) {
            if (!silent) setLocStatus('定位：轨迹数据未就绪');
            return false;
        }
        if (result.deviationKm > 1.0) {
            setLocStatus('定位：偏离路线 ' + result.deviationKm.toFixed(2) + ' 公里，未填入距离');
            return false;
        }
        document.getElementById('currDist').value = result.matchedKm.toFixed(2);
        setLocStatus('定位：已获取 ' + hmNow() + (result.deviationKm > 1.0 ? '（偏离路线 ' + result.deviationKm.toFixed(2) + ' 公里）' : ''));
        lastMatchPoint = { lat: position.coords.latitude, lon: position.coords.longitude };
        renderTrackMap();
        tryAutoPredict();
        return true;
    }
    function startWatching() {
        if (watchId !== null || !navigator.geolocation) return;
        watchId = navigator.geolocation.watchPosition(
            (position) => {
                const now = Date.now();
                if (now - lastWatchUpdate < 10000) return;
                lastWatchUpdate = now;
                if (cacheReady()) applyPosition(position, true);
            },
            () => {},
            { enableHighAccuracy: true, timeout: 20000, maximumAge: 5000 }
        );
    }
    function doSilentLocate() {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                applyPosition(position, true);
                startWatching();
            },
            (error) => {
                if (error.code === 1) setLocStatus('定位：未授权，请在浏览器站点设置里允许位置信息');
                else setLocStatus('定位：获取失败，点「设备自动定位」重试');
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }
    function autoLocateOnLoad() {
        if (!navigator.geolocation) { setLocStatus('定位：浏览器不支持'); return; }
        let tries = 0;
        const iv = setInterval(() => {
            tries++;
            if (cacheReady() || tries > 30) {
                clearInterval(iv);
                if (cacheReady() || projectCsvDataCache.length > 0) doSilentLocate();
            }
        }, 500);
    }
    function onDataReady() {
        if (cacheReady()) doSilentLocate();
        else tryAutoPredict();
    }
    function setNowTime() {
        timeTouched = false;
        const now = new Date();
        document.getElementById('nowH').value = String(now.getHours()).padStart(2, '0');
        document.getElementById('nowM').value = String(now.getMinutes()).padStart(2, '0');
        calcDiffTime();
    }

    // 核心联动：时间框变动，立刻更新已耗时
    function calcDiffTime() {
        const sh = document.getElementById('startH').value;
        const sm = document.getElementById('startM').value;
        const nh = document.getElementById('nowH').value;
        const nm = document.getElementById('nowM').value;
        
        // 四个框都填满才计算
        if (sh === '' || sm === '' || nh === '' || nm === '') return;

        let startMins = parseInt(sh) * 60 + parseInt(sm);
        let nowMins = parseInt(nh) * 60 + parseInt(nm);
        
        if (nowMins < startMins) nowMins += 24 * 60; 

        const diffHours = (nowMins - startMins) / 60;
        document.getElementById('currTime').value = diffHours.toFixed(2);
        tryAutoPredict();
    }

    // ==================== 高鲁棒性 GPS 解析器 ====================
    
    function calcHaversine(lat1, lon1, lat2, lon2) {
        const R = 6371.0;
        const toRad = Math.PI / 180;
        const dLat = (lat2 - lat1) * toRad;
        const dLon = (lon2 - lon1) * toRad;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) *
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 万能坐标解析：屏蔽中英文符号干扰，智能提取
    function parseCoordinates(input) {
        // 1. 去除干扰标签(如【GCJ02】)，标点符号统一转换
        let str = input.replace(/【.*?】/g, '').replace(/[，。]/g, ',').toUpperCase();
        
        // 2. 提取所有数字块和方向标识
        const nums = str.match(/\d+(?:\.\d+)?/g);
        const dirs = str.match(/[NSWE]/g) || [];
        
        if (!nums) return null;

        let lat, lon;

        // 场景 A：度分秒格式 (如：31° 5 46 N 109°54 22") - 必定能提取出6个数字
        if (nums.length >= 6) {
            let val1 = parseFloat(nums[0]) + parseFloat(nums[1])/60 + parseFloat(nums[2])/3600;
            let val2 = parseFloat(nums[3]) + parseFloat(nums[4])/60 + parseFloat(nums[5])/3600;

            if (dirs.includes('S')) val1 = -val1; 
            if (dirs.includes('W')) val2 = -val2;

            lat = val1; lon = val2;
        }
        // 场景 B：十进制度格式 (如：31.0711, 109.9311) - 至少能提取出2个数字
        else if (nums.length >= 2) {
            let val1 = parseFloat(nums[0]);
            let val2 = parseFloat(nums[1]);

            // 根据南半球或西半球符号赋予负值
            const p1 = str.split(nums[0])[1];
            if (p1 && p1.match(/^\s*°?\s*S/)) val1 = -val1;
            const p2 = str.split(nums[1])[1];
            if (p2 && p2.match(/^\s*°?\s*W/)) val2 = -val2;

            lat = val1; lon = val2;
        } else {
            return null;
        }

        // 【智能纠错】：自动纠正经纬度反写。地球纬度绝不超过90，如果是中国坐标，经度多在90以上
        if (Math.abs(lat) > 90 && Math.abs(lon) <= 90) {
            let temp = lat;
            lat = lon;
            lon = temp;
        }

        if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null; // 完全不合法的地球坐标
        return { lat, lon };
    }

    function matchRouteWithCoordinates(userLat, userLon) {
        if (projectCsvDataCache.length === 0) return { error: "当前项目无轨迹数据，无法匹配。" };
        const elapsed = parseFloat(document.getElementById('currTime').value);
        const hasElapsed = !isNaN(elapsed) && elapsed > 0;
        let nearCandidates = [];
        
        let globalClosestDist = Infinity;
        let matchedRouteDistKm = 0;

        projectCsvDataCache.forEach(gpx => {
            gpx.data.forEach(point => {
                if (point.lat && point.lon) {
                    let distToPoint = calcHaversine(userLat, userLon, point.lat, point.lon);
                    if (distToPoint < globalClosestDist) {
                        globalClosestDist = distToPoint;
                        matchedRouteDistKm = point.dist;
                    }
                    if (distToPoint <= 0.2) {
                        nearCandidates.push({ dist: distToPoint, km: point.dist, refSpeed: gpx.avgSpeed || 0 });
                    }
                }
            });
        });

        if (globalClosestDist === Infinity) return { error: "历史轨迹中没有坐标数据。请删除旧项目重传 GPX 文件！" };
        // 环线/往返/交叉点：同一位置对应多个轨迹点时，用速度挑——候选距离除以已耗时的隐含速度，与该基准的参照平均速度最接近的胜出
        if (hasElapsed && elapsed >= 0.05 && nearCandidates.length > 1) {
            let best = null;
            let bestScore = Infinity;
            nearCandidates.forEach(c => {
                if (!c.refSpeed || c.refSpeed <= 0) return;
                const s = Math.abs(c.km / elapsed - c.refSpeed);
                if (best === null || s < bestScore || (s === bestScore && c.dist < best.dist)) {
                    bestScore = s;
                    best = c;
                }
            });
            if (best !== null) {
                matchedRouteDistKm = best.km;
                globalClosestDist = best.dist;
            }
        }
        return { matchedKm: matchedRouteDistKm, deviationKm: globalClosestDist };
    }

    function manualLocate() {
        const inputStr = document.getElementById('manualGpsInput').value;
        if (!inputStr) return alert("请先输入文本框中的坐标");
        
        const coords = parseCoordinates(inputStr);
        if (!coords) return alert("无法识别格式！支持复制的格式如：\n【GCJ02】31.071°N，109.931°E \n或\n 31° 5 46.2 N 109°54 22 E");

        const result = matchRouteWithCoordinates(coords.lat, coords.lon);
        if (result.error) return alert(result.error);

        if (result.deviationKm > 1.0) {
            alert(`⚠️ 坐标警告：此点距离当前路线最近处有 ${(result.deviationKm).toFixed(2)} 公里，请确认是否偏离路线！`);
        }
        document.getElementById('currDist').value = result.matchedKm.toFixed(2);
        lastMatchPoint = { lat: coords.lat, lon: coords.lon };
        renderTrackMap();
        tryAutoPredict();
    }

    function autoLocate() {
        if (!navigator.geolocation) return alert("您的浏览器不支持定位功能。");
        
        const btn = document.getElementById('gpsBtn');
        const originalText = btn.innerText;
        btn.innerText = "定位中..."; btn.disabled = true;

        navigator.geolocation.getCurrentPosition(
            (position) => {
                btn.innerText = originalText; btn.disabled = false;
                const result = matchRouteWithCoordinates(position.coords.latitude, position.coords.longitude);
                if (result.error) return alert(result.error);

                if (result.deviationKm > 1.0) {
                    alert(`⚠️ 定位警告：当前位置距离路线最近处有 ${(result.deviationKm).toFixed(2)} 公里，请确认是否偏离路线！`);
                }
                document.getElementById('currDist').value = result.matchedKm.toFixed(2);
                setLocStatus('定位：已获取 ' + hmNow());
                lastMatchPoint = { lat: position.coords.latitude, lon: position.coords.longitude };
                renderTrackMap();
                tryAutoPredict();
                startWatching();
            },
            (error) => {
                btn.innerText = originalText; btn.disabled = false;
                let msg = "定位失败。请确保已授予浏览器位置权限。";
                if (error.code === 1) msg = "您拒绝了定位请求。";
                setLocStatus('定位：' + msg);
                alert(msg);
            },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    }

    // ==================== 路线示意图 ====================
    let lastMatchPoint = null;
    const MAP_COLORS = ['#007aff', '#34c759', '#ff9500', '#af52de', '#ff3b30', '#00c7be'];
    function renderTrackMap() {
        const wrap = document.getElementById('trackMapWrap');
        const host = document.getElementById('trackMap');
        if (!wrap || !host) return;
        const withCoords = projectCsvDataCache.filter(g => g.data.some(p => p.lat && p.lon));
        if (withCoords.length === 0) { wrap.style.display = 'none'; host.innerHTML = ''; return; }
        let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
        withCoords.forEach(g => g.data.forEach(p => {
            if (!p.lat || !p.lon) return;
            if (p.lat < minLat) minLat = p.lat;
            if (p.lat > maxLat) maxLat = p.lat;
            if (p.lon < minLon) minLon = p.lon;
            if (p.lon > maxLon) maxLon = p.lon;
        }));
        if (!isFinite(minLat)) { wrap.style.display = 'none'; return; }
        const midLat = (minLat + maxLat) / 2 * Math.PI / 180;
        const kx = Math.cos(midLat) || 1;
        const W = 560, H = 360, PAD = 28;
        const spanX = Math.max((maxLon - minLon) * kx, 1e-9);
        const spanY = Math.max(maxLat - minLat, 1e-9);
        const scale = Math.min((W - 2 * PAD) / spanX, (H - 2 * PAD) / spanY);
        const ox = (W - spanX * scale) / 2, oy = (H - spanY * scale) / 2;
        const X = lon => ox + (lon - minLon) * kx * scale;
        const Y = lat => oy + (maxLat - lat) * scale;
        const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        let parts = ['<svg id="trackMapSvg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="路线示意图">'];
        withCoords.forEach((g, gi) => {
            const pts = g.data.filter(p => p.lat && p.lon);
            if (pts.length < 2) return;
            const color = MAP_COLORS[gi % MAP_COLORS.length];
            const d = pts.map((p, i) => (i === 0 ? 'M' : 'L') + X(p.lon).toFixed(1) + ' ' + Y(p.lat).toFixed(1)).join(' ');
            parts.push('<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" opacity="0.85"><title>' + esc(g.name) + '</title></path>');
        });
        const base = withCoords[0];
        const bpts = base.data.filter(p => p.lat && p.lon);
        const totalKm = bpts.length ? bpts[bpts.length - 1].dist : 0;
        for (let km = 1; km < totalKm; km++) {
            let best = null, bestDiff = Infinity;
            bpts.forEach(p => { const dd = Math.abs(p.dist - km); if (dd < bestDiff) { bestDiff = dd; best = p; } });
            if (!best) continue;
            const cx = X(best.lon).toFixed(1), cy = Y(best.lat).toFixed(1);
            parts.push('<g class="km-dot" data-km="' + km + '" onclick="setDistFromMap(' + km + ')"><circle cx="' + cx + '" cy="' + cy + '" r="11" fill="transparent"/><circle cx="' + cx + '" cy="' + cy + '" r="4" fill="#ffffff" stroke="#007aff" stroke-width="2"/><text class="km-label" x="' + (+cx + 8) + '" y="' + (+cy + 4) + '">' + km + '</text></g>');
        }
        if (bpts.length >= 2) {
            const s = bpts[0], e = bpts[bpts.length - 1];
            parts.push('<circle cx="' + X(s.lon).toFixed(1) + '" cy="' + Y(s.lat).toFixed(1) + '" r="6" fill="#34c759" stroke="#ffffff" stroke-width="2"><title>起点</title></circle>');
            parts.push('<circle cx="' + X(e.lon).toFixed(1) + '" cy="' + Y(e.lat).toFixed(1) + '" r="6" fill="#ff3b30" stroke="#ffffff" stroke-width="2"><title>终点</title></circle>');
        }
        if (lastMatchPoint && lastMatchPoint.lat && lastMatchPoint.lon) {
            const cx = X(lastMatchPoint.lon).toFixed(1), cy = Y(lastMatchPoint.lat).toFixed(1);
            parts.push('<circle cx="' + cx + '" cy="' + cy + '" r="10" fill="#007aff" opacity="0.25"/><circle cx="' + cx + '" cy="' + cy + '" r="5" fill="#007aff" stroke="#ffffff" stroke-width="2"><title>当前位置</title></circle>');
        }
        parts.push('</svg>');
        host.innerHTML = parts.join('');
        wrap.style.display = 'block';
    }
    function setDistFromMap(km) {
        document.getElementById('currDist').value = km.toFixed(1);
        tryAutoPredict();
    }

    // ==================== 离线前端计算核心逻辑 ====================
    function predictTimeLocally() {
        if (projectCsvDataCache.length === 0) return alert("当前项目没有任何参考基准数据！");
        
        const currentDist = parseFloat(document.getElementById('currDist').value);
        const currentTime = parseFloat(document.getElementById('currTime').value);

        if (isNaN(currentDist) || isNaN(currentTime) || currentDist <= 0 || currentTime <= 0) {
            return alert("请输入有效的距离和时间数据");
        }

        let globalBestMatch = null;
        let globalMinDiff = Infinity;
        let bestGpxName = "";
        let bestGpxData = null;

        projectCsvDataCache.forEach(gpx => {
            const data = gpx.data;
            if (data.length === 0 || data[data.length-1].dist < currentDist) return;
            const totalDist = data[data.length-1].dist;

            let localBest = null;
            let localBestScore = Infinity;
            let localBestDistDiff = Infinity;
            const refSpeed = (gpx.avgSpeed && gpx.avgSpeed > 0) ? gpx.avgSpeed : 0;
            
            const cands = [];
            data.forEach(item => {
                let distDiff = Math.abs(item.dist - currentDist);
                // 环线：距离按一圈取模，起点附近也要考虑终点一侧的点
                if (gpx.isLoop && totalDist > 0) {
                    distDiff = Math.min(distDiff, Math.abs(item.dist - currentDist - totalDist), Math.abs(item.dist - currentDist + totalDist));
                }
                if (distDiff > 0.5) return;
                if (item.time <= 0.01) return;
                cands.push({ item: item, distDiff: distDiff });
            });
            // 按基准时间聚类：时间断层超 0.5h 说明是不同的圈/路段，先用速度选簇，再在簇内取距离最近的点
            const tOf = c => (isNaN(c.item.time) ? Infinity : c.item.time);
            cands.sort((a, b) => tOf(a) - tOf(b));
            const clusters = [];
            cands.forEach(c => {
                const lastCluster = clusters[clusters.length - 1];
                if (lastCluster && tOf(c) - tOf(lastCluster[lastCluster.length - 1]) <= 0.5) {
                    lastCluster.push(c);
                } else {
                    clusters.push([c]);
                }
            });
            clusters.forEach(cl => {
                let rep = cl[0];
                cl.forEach(c => { if (c.distDiff < rep.distDiff) rep = c; });
                const score = refSpeed > 0 ? Math.abs(rep.item.dist / currentTime - refSpeed) : Math.abs(tOf(rep) - currentTime);
                if (localBest === null || score < localBestScore || (score === localBestScore && rep.distDiff < localBestDistDiff)) {
                    localBest = rep.item;
                    localBestScore = score;
                    localBestDistDiff = rep.distDiff;
                }
            });

            if (!localBest || localBest.time <= 0.01) return;

            let timeDiff = Math.abs(currentTime - localBest.time);
            if (timeDiff < globalMinDiff) {
                globalMinDiff = timeDiff;
                globalBestMatch = localBest;
                bestGpxName = gpx.name;
                bestGpxData = data;
            }
        });

        const resultBox = document.getElementById('predictResult');
        resultBox.style.display = 'block';

        if (!globalBestMatch) {
            resultBox.className = 'result-box error';
            resultBox.innerHTML = `⚠️ 未找到匹配路段（当前距离可能超出历史记录，或起点偏差过大）`;
            return;
        }

        const refTotalTime = bestGpxData[bestGpxData.length - 1].time;
        const refCurrentTime = globalBestMatch.time;
        const refRemainingTime = refTotalTime - refCurrentTime;
        const paceRatio = currentTime / refCurrentTime;

        resultBox.className = 'result-box success';
        resultBox.innerHTML = `
            <div style="text-align: left;">
                <div style="font-size: 18px; font-weight: 600; color: #1c1c1e; margin-bottom: 12px;">
                    剩余预计: <span style="color: var(--primary); font-size: 24px;">${(refRemainingTime * paceRatio).toFixed(2)}</span> h<br>
                    总计预计: <span style="color: #34c759; font-size: 24px;">${(currentTime + refRemainingTime * paceRatio).toFixed(2)}</span> h
                </div>
                <div style="background: rgba(0,0,0,0.04); padding: 12px; border-radius: 8px; font-size: 13px; color: #666; line-height: 1.6;">
                    <strong>📍 基准轨迹:</strong> ${bestGpxName}<br>
                    <strong>⏱️ 基准总用时:</strong> ${refTotalTime.toFixed(2)} h<br>
                    <strong>📌 同步点用时:</strong> 基准 ${refCurrentTime.toFixed(2)} h (当前 ${currentTime} h)<br>
                    <strong>📈 配速倍率:</strong> ${paceRatio.toFixed(2)} <span style="font-size: 11px; color: #999;">(>1表示比基准慢)</span>
                </div>
            </div>
        `;
    }

    // ==================== 数据获取与解析 ====================
    // 裁掉首尾静止段：按实际出发/到达时间算；起点/终点起位移超 50 米才算真正出发/到达，中间静止保留；裁后距离与时间重定零点
    function trimStationaryEnds(data) {
        if (data.length < 2) return data;
        const first = data.find(p => p.lat && p.lon);
        let last = null;
        for (let i = data.length - 1; i >= 0; i--) {
            if (data[i].lat && data[i].lon) { last = data[i]; break; }
        }
        if (!first || !last || first === last) return data;
        let startIdx = -1;
        for (let i = 0; i < data.length; i++) {
            const p = data[i];
            if (p.lat && p.lon && calcHaversine(first.lat, first.lon, p.lat, p.lon) > 0.05) { startIdx = i; break; }
        }
        if (startIdx < 0) return data;
        let endIdx = -1;
        for (let i = data.length - 1; i >= 0; i--) {
            const p = data[i];
            if (p.lat && p.lon && calcHaversine(last.lat, last.lon, p.lat, p.lon) > 0.05) { endIdx = i; break; }
        }
        if (endIdx < 0 || endIdx - startIdx < 1) return data;
        const sliced = data.slice(startIdx, endIdx + 1);
        const d0 = isNaN(sliced[0].dist) ? 0 : sliced[0].dist;
        const t0 = isNaN(sliced[0].time) ? 0 : sliced[0].time;
        return sliced.map(p => ({ lat: p.lat, lon: p.lon, dist: p.dist - d0, time: p.time - t0 }));
    }
    // 均匀补齐断点：相邻两点时间间隔超 60 秒时，按 30 秒一格线性插值补点（位置/距离/时间均匀过渡）；断点之外的数值不受影响
    function fillTimeGaps(data) {
        if (data.length < 2) return data;
        const out = [data[0]];
        for (let i = 1; i < data.length; i++) {
            const prev = data[i - 1];
            const cur = data[i];
            const dt = cur.time - prev.time;
            if (isFinite(dt) && dt > 60 / 3600) {
                const n = Math.min(Math.floor(dt * 3600 / 30), 120);
                for (let k = 1; k <= n; k++) {
                    const f = k / (n + 1);
                    out.push({
                        lat: (prev.lat !== undefined && cur.lat !== undefined) ? prev.lat + (cur.lat - prev.lat) * f : prev.lat,
                        lon: (prev.lon !== undefined && cur.lon !== undefined) ? prev.lon + (cur.lon - prev.lon) * f : prev.lon,
                        dist: prev.dist + (cur.dist - prev.dist) * f,
                        time: prev.time + (cur.time - prev.time) * f,
                    });
                }
            }
            out.push(cur);
        }
        return out;
    }
    // 环线：首尾点闭合（0.3km 内）且后半程不大量重合前半程；往返：闭合且大量重合
    function classifyRoute(data) {
        const pts = data.filter(p => p.lat && p.lon);
        if (pts.length < 10) return '';
        const first = pts[0];
        const last = pts[pts.length - 1];
        const totalDist = data[data.length - 1].dist;
        if (isNaN(totalDist) || totalDist < 1) return '';
        if (calcHaversine(first.lat, first.lon, last.lat, last.lon) > 0.3) return '';
        const half = Math.floor(pts.length / 2);
        let near = 0;
        let sampled = 0;
        for (let i = half; i < pts.length; i += 10) {
            sampled++;
            for (let j = 0; j < half; j += 10) {
                if (calcHaversine(pts[i].lat, pts[i].lon, pts[j].lat, pts[j].lon) <= 0.05) { near++; break; }
            }
        }
        if (sampled > 0 && near / sampled > 0.3) return '往返';
        return '环线';
    }
    async function loadProjectRecords(projectId) {
        const res = await fetch(`${API_PREFIX}/projects/${projectId}/records`);
        const records = await res.json();
        expectedCsvCount = records.length;
        
        const listUi = document.getElementById('gpxList');
        const recordsCard = document.getElementById('recordsCard');
        listUi.innerHTML = '';
        projectCsvDataCache = []; 
        
        if (records.length > 0) {
            recordsCard.style.display = 'block';
            for (const r of records) {
                
                let kind = '';
                try {
                    const csvRes = await fetch(`${API_PREFIX}/csv/${r.id}`);
                    const csvText = await csvRes.text();
                    const rows = csvText.trim().split('\n').slice(1); 
                    
                    const parsedData = rows.map(row => {
                        const parts = row.split(',');
                        if (parts.length >= 4) {
                            return { lat: parseFloat(parts[0]), lon: parseFloat(parts[1]), dist: parseFloat(parts[2]), time: parseFloat(parts[3]) };
                        }
                        return { dist: parseFloat(parts[0]), time: parseFloat(parts[1]) };
                    }).filter(item => !isNaN(item.dist));
                    
                    const trimmedData = trimStationaryEnds(parsedData);
                    const filledData = fillTimeGaps(trimmedData);
                    kind = classifyRoute(filledData);
                    const lastPt = filledData.length > 0 ? filledData[filledData.length - 1] : null;
                    const avgSpeed = (lastPt && lastPt.time > 0) ? lastPt.dist / lastPt.time : 0;
                    projectCsvDataCache.push({ name: r.original_name, data: filledData, isLoop: kind === '环线', avgSpeed: avgSpeed });
                } catch (e) {
                    console.error("缓存 CSV 数据失败:", r.original_name, e);
                }
                listUi.innerHTML += `
                    <li class="file-item">
                        <div style="display: flex; flex-direction: column;">
                            <span>${r.original_name}</span>
                            <span style="font-size: 12px; color: #8e8e93; margin-top: 4px;">${kind ? '缓存就绪 · ' + kind + ' | ' : '缓存就绪 | '}${r.size_formatted}</span>
                        </div>
                    </li>`;
            }
        } else {
            recordsCard.style.display = 'none';
        }
        onDataReady();
        renderTrackMap();
    }

    // ==================== 基础初始化逻辑 ====================
    async function loadProjects() {
        const res = await fetch(`${API_PREFIX}/projects`);
        const projects = await res.json();
        const select = document.getElementById('projectSelect');
        select.innerHTML = '<option value="">-- 选择路线项目 --</option>';
        projects.forEach(p => { select.innerHTML += `<option value="${p.id}">${p.name}</option>`; });
    }

    document.getElementById('projectSelect').addEventListener('change', function(e) {
        currentProjectId = e.target.value;
        const workspace = document.getElementById('workspace');
        if (currentProjectId) {
            localStorage.setItem('last_hike_project_id', currentProjectId); 
            workspace.style.display = 'block';
            document.getElementById('predictResult').style.display = 'none'; 
            initDropzone();
            loadProjectRecords(currentProjectId);
        } else {
            workspace.style.display = 'none';
        }
    });

    async function createProject() {
        const name = document.getElementById('newProjectName').value;
        if (!name) return;
        const res = await fetch(`${API_PREFIX}/projects`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name: name})
        });
        const data = await res.json();
        if (res.ok) {
            document.getElementById('newProjectName').value = '';
            await loadProjects();
            document.getElementById('projectSelect').value = data.id;
            document.getElementById('projectSelect').dispatchEvent(new Event('change'));
        } else { alert(data.error); }
    }

    function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.onerror = () => reject(new Error("读取失败"));
            reader.readAsDataURL(file);
        });
    }

    async function processQueue() {
        if (isUploading || uploadQueue.length === 0) return;
        isUploading = true;
        while (uploadQueue.length > 0) {
            const file = uploadQueue.shift();
            file.status = Dropzone.UPLOADING;
            myDropzone.emit("processing", file);
            try {
                const base64String = await readFileAsBase64(file);
                const res = await fetch(`${API_PREFIX}/upload`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ project_id: currentProjectId, filename: file.name, file_base64: base64String })
                });
                const data = await res.json();
                if (res.ok) { file.status = Dropzone.SUCCESS; myDropzone.emit("success", file, data, null); } 
                else throw new Error(data.error);
            } catch (err) {
                file.status = Dropzone.ERROR; myDropzone.emit("error", file, err.message);
            } finally { myDropzone.emit("complete", file); }
        }
        isUploading = false;
        loadProjectRecords(currentProjectId); 
        document.getElementById('uploadDetails').removeAttribute('open'); 
    }

    function initDropzone() {
        if(myDropzone) return;
        myDropzone = new Dropzone("#gpxDropzone", {
            url: "/dummy-url", autoProcessQueue: false, maxFilesize: 50, acceptedFiles: ".gpx,.kml,.kmz",
            dictDefaultMessage: "点击或批量拖拽 GPX / KML / KMZ 至此", addRemoveLinks: false
        });
        myDropzone.on("addedfile", function(file) {
            if (!currentProjectId) { myDropzone.removeFile(file); return alert("请先选择项目！"); }
            uploadQueue.push(file);
            processQueue(); 
        });
    }

    window.onload = async () => {
        loadTimeStatus();
        await loadProjects();
        const lastId = localStorage.getItem('last_hike_project_id');
        if (lastId) {
            const select = document.getElementById('projectSelect');
            if (Array.from(select.options).some(opt => opt.value === lastId)) {
                select.value = lastId;
                select.dispatchEvent(new Event('change'));
            }
        }
        startTimeTicker();
        autoLocateOnLoad();
    };
</script>
